name: Build and Push Docker Image to Registry

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

env:
  REGISTRY: docker.io  # или ghcr.io, или ваш приватный реестр
  IMAGE_NAME: flask-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write  # нужно для GitHub Container Registry

    steps:
    # 1. Клонирование репозитория
    - name: Checkout repository
      uses: actions/checkout@v3
    
    # 2. Настройка Docker Buildx (для продвинутой сборки)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    # 3. Логин в Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    # 4. Сборка и пуш образа
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
